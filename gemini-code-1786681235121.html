<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraFlow | AI Voice Dictation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        /* Premium Pulse Animation for Mic */
        .recording-active {
            background-color: #1e1b4b !important;
            border-color: #6366f1 !important;
            color: #818cf8 !important;
            animation: pulse-ring 2s infinite;
        }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.5); }
            70% { box-shadow: 0 0 0 25px rgba(99, 102, 241, 0); }
            100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex flex-col selection:bg-indigo-500/30">

    <!-- Navbar -->
    <nav class="border-b border-slate-800 p-4 flex justify-between items-center bg-slate-950/80 backdrop-blur-md sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                <i class="fas fa-wave-square text-white text-sm"></i>
            </div>
            <h1 class="text-xl font-bold tracking-tight text-white">Aura<span class="text-indigo-400">Flow</span></h1>
        </div>
        <button id="settingsBtn" class="text-slate-400 hover:text-white transition-colors duration-200" title="AI Settings">
            <i class="fas fa-microchip text-xl"></i>
        </button>
    </nav>

    <!-- Main Workspace -->
    <main class="flex-grow container mx-auto px-4 py-10 flex flex-col items-center max-w-5xl">
        
        <!-- Microphone Interface -->
        <div class="flex flex-col items-center mb-12">
            <button id="micBtn" class="w-24 h-24 rounded-full bg-slate-900 border border-slate-700 flex items-center justify-center text-4xl text-slate-400 hover:text-indigo-400 hover:border-indigo-500 transition-all duration-300 shadow-2xl relative z-10 group">
                <i class="fas fa-microphone group-hover:scale-110 transition-transform duration-300"></i>
            </button>
            <p id="statusText" class="mt-6 text-slate-400 font-medium tracking-wide">Click to start dictating</p>
        </div>

        <!-- Output Grids -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 w-full">
            
            <!-- Raw ASR Stream -->
            <div class="flex flex-col bg-slate-900/50 border border-slate-800 rounded-2xl p-6 shadow-xl relative">
                <h2 class="text-xs font-bold uppercase tracking-widest text-slate-500 mb-4 flex justify-between items-center">
                    <span><i class="fas fa-stream mr-2"></i>Raw Stream</span>
                    <span id="listeningIndicator" class="hidden flex items-center text-emerald-400 text-xs">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 mr-2 animate-pulse"></span>Listening
                    </span>
                </h2>
                <div id="rawText" class="flex-grow min-h-[250px] text-slate-300 text-lg leading-relaxed outline-none" contenteditable="true" spellcheck="false" placeholder="Your speech will appear here instantly..."></div>
                <button id="clearBtn" class="absolute bottom-4 right-4 text-slate-500 hover:text-red-400 text-sm transition px-3 py-1 bg-slate-800/50 rounded-md">Clear</button>
            </div>

            <!-- AI Polished Output -->
            <div class="flex flex-col bg-slate-800/40 border border-indigo-900/40 rounded-2xl p-6 shadow-2xl shadow-indigo-900/10 relative">
                <h2 class="text-xs font-bold uppercase tracking-widest text-indigo-400 mb-4 flex justify-between items-center">
                    <span><i class="fas fa-wand-magic-sparkles mr-2"></i>AI Polished Text</span>
                    <button id="copyBtn" class="text-slate-400 hover:text-white transition px-2 py-1 rounded bg-slate-700/50 hover:bg-indigo-500" title="Copy to Clipboard">
                        <i class="far fa-copy"></i> Copy
                    </button>
                </h2>
                <div id="polishedText" class="flex-grow min-h-[250px] text-white text-lg leading-relaxed outline-none" contenteditable="true" spellcheck="false"></div>
                
                <button id="polishBtn" class="mt-5 w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3.5 rounded-xl transition-all duration-200 shadow-lg shadow-indigo-600/20 flex items-center justify-center gap-2 border border-indigo-500 hover:border-indigo-400">
                    <i class="fas fa-bolt"></i> Clean & Format
                </button>
            </div>
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center z-50 opacity-0 transition-opacity duration-300">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl p-8 w-full max-w-md m-4 shadow-2xl transform scale-95 transition-transform duration-300" id="settingsBox">
            <h3 class="text-2xl font-bold text-white mb-2">Neural Engine Config</h3>
            <p class="text-sm text-slate-400 mb-6 leading-relaxed">Add a free Google Gemini API key to enable advanced contextual formatting. If left blank, AuraFlow uses local Regex algorithms to clean text.</p>
            
            <div class="mb-6">
                <label class="block text-xs font-medium text-slate-500 uppercase tracking-wider mb-2">Gemini API Key</label>
                <input type="password" id="apiKeyInput" placeholder="AIzaSy..." class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all font-mono text-sm">
                <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-xs text-indigo-400 hover:text-indigo-300 mt-2 inline-block">Get a free key here &rarr;</a>
            </div>
            
            <div class="flex justify-end gap-3">
                <button id="closeSettingsBtn" class="px-5 py-2.5 text-slate-400 hover:text-white font-medium transition">Cancel</button>
                <button id="saveSettingsBtn" class="px-5 py-2.5 bg-white text-slate-900 font-semibold rounded-lg hover:bg-slate-200 transition shadow-lg shadow-white/10">Save Engine</button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-emerald-500 text-white px-6 py-3 rounded-full font-medium shadow-xl translate-y-20 opacity-0 transition-all duration-300 z-50">
        Copied to clipboard!
    </div>

    <script>
        // --- DOM Elements ---
        const micBtn = document.getElementById('micBtn');
        const statusText = document.getElementById('statusText');
        const listeningIndicator = document.getElementById('listeningIndicator');
        const rawText = document.getElementById('rawText');
        const polishedText = document.getElementById('polishedText');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');
        const polishBtn = document.getElementById('polishBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const saveSettingsBtn = document.getElementById('saveSettingsBtn');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const toast = document.getElementById('toast');
        const settingsBox = document.getElementById('settingsBox');

        // --- State Management ---
        let isRecording = false;
        let finalTranscript = '';
        let geminiApiKey = localStorage.getItem('auraflow_api_key') || '';
        apiKeyInput.value = geminiApiKey;

        // --- Speech Recognition Setup (Bug-Free Architecture) ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("Your browser doesn't support the Web Speech API. Please use Google Chrome.");
        }
        
        const recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'en-US';

        recognition.onstart = () => {
            isRecording = true;
            micBtn.classList.add('recording-active');
            statusText.textContent = "Listening securely...";
            listeningIndicator.classList.remove('hidden');
        };

        recognition.onresult = (event) => {
            let interimTranscript = '';
            let newFinal = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    newFinal += event.results[i][0].transcript + ' ';
                } else {
                    interimTranscript += event.results[i][0].transcript;
                }
            }
            finalTranscript += newFinal;
            
            // Render text with interim results highlighted
            rawText.innerHTML = finalTranscript + '<span class="text-indigo-400/70 italic">' + interimTranscript + '</span>';
            scrollToBottom(rawText);
        };

        recognition.onerror = (event) => {
            console.error("Speech Recognition Error: ", event.error);
            if(event.error === 'not-allowed') {
                isRecording = false;
                updateMicUI();
                alert("Microphone access blocked.");
            }
        };

        // The Auto-Restart Bug Fix
        recognition.onend = () => {
            if (isRecording) {
                recognition.start(); // Keep listening if not explicitly stopped
            } else {
                updateMicUI();
            }
        };

        function updateMicUI() {
            micBtn.classList.remove('recording-active');
            statusText.textContent = "Click to start dictating";
            listeningIndicator.classList.add('hidden');
        }

        micBtn.addEventListener('click', () => {
            if (isRecording) {
                isRecording = false;
                recognition.stop();
            } else {
                try { recognition.start(); } catch(e) {} // Catch already-started errors
            }
        });

        // --- Core Cleaning Logic ---
        async function processText() {
            const raw = rawText.innerText.trim();
            if (!raw) return;

            polishBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Processing...';
            polishBtn.disabled = true;
            polishedText.classList.add('opacity-50');

            if (geminiApiKey) {
                // High-End Neural Network Processing
                try {
                    const prompt = `You are an expert dictation formatter. The following is raw speech-to-text. Remove filler words (um, ah, like, you know), correct grammatical mistakes, fix stuttering (repeated words), add proper punctuation, and format it beautifully. Do not add any conversational replies. ONLY output the corrected text:\n\n${raw}`;
                    
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiApiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            generationConfig: { temperature: 0.2 }
                        })
                    });

                    const data = await response.json();
                    if(data.error) throw new Error(data.error.message);
                    
                    polishedText.innerText = data.candidates[0].content.parts[0].text.trim();
                } catch (err) {
                    console.error(err);
                    alert("API Error. Falling back to local Regex cleaner.");
                    localRegexClean(raw);
                }
            } else {
                // Local Regex Processing Fallback
                localRegexClean(raw);
            }

            polishBtn.innerHTML = '<i class="fas fa-bolt"></i> Clean & Format';
            polishBtn.disabled = false;
            polishedText.classList.remove('opacity-50');
        }

        function localRegexClean(text) {
            let cleaned = text
                // Remove filler words
                .replace(/\b(um|uh|hmm|like|you know|sort of|kind of)\b/gi, '')
                // Remove double words (stutters)
                .replace(/\b(\w+)\s+\1\b/gi, '$1')
                // Fix spacing
                .replace(/\s{2,}/g, ' ')
                .trim();
            
            // Basic Auto-Capitalization
            cleaned = cleaned.charAt(0).toUpperCase() + cleaned.slice(1);
            cleaned = cleaned.replace(/([.!?]\s+)([a-z])/g, (m, p1, p2) => p1 + p2.toUpperCase());
            
            polishedText.innerText = cleaned;
        }

        polishBtn.addEventListener('click', processText);

        // --- Utility Functions ---
        clearBtn.addEventListener('click', () => {
            finalTranscript = '';
            rawText.innerHTML = '';
            polishedText.innerText = '';
        });

        copyBtn.addEventListener('click', () => {
            const textToCopy = polishedText.innerText || rawText.innerText;
            if(!textToCopy) return;
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                showToast("Text copied to clipboard!");
            });
        });

        function showToast(msg) {
            toast.innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function scrollToBottom(el) {
            el.scrollTop = el.scrollHeight;
        }

        // --- Settings Modal Logic ---
        settingsBtn.addEventListener('click', () => {
            settingsModal.classList.remove('hidden');
            settingsModal.classList.add('flex');
            setTimeout(() => {
                settingsModal.classList.remove('opacity-0');
                settingsBox.classList.remove('scale-95');
            }, 10);
        });

        function closeModal() {
            settingsModal.classList.add('opacity-0');
            settingsBox.classList.add('scale-95');
            setTimeout(() => {
                settingsModal.classList.add('hidden');
                settingsModal.classList.remove('flex');
            }, 300);
        }

        closeSettingsBtn.addEventListener('click', closeModal);
        saveSettingsBtn.addEventListener('click', () => {
            geminiApiKey = apiKeyInput.value.trim();
            localStorage.setItem('auraflow_api_key', geminiApiKey);
            closeModal();
            showToast("Engine configuration saved!");
        });
    </script>
</body>
</html>
