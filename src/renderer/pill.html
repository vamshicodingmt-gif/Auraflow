<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws://localhost:* http://localhost:*; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>AuraFlow · Recording</title>
  </head>
  <body class="pill-page">
    <main class="pill" data-state="arming" role="status" aria-live="polite">
      <span class="pill-mark" aria-hidden="true"></span>
      <div class="pill-center">
        <canvas class="pill-wave" aria-hidden="true"></canvas>
        <p class="pill-detail" hidden></p>
      </div>
      <div class="pill-meta">
        <span class="pill-label">Preparing</span>
        <span class="pill-time">00:00</span>
      </div>
      <button class="pill-cancel icon-btn" type="button" aria-label="Cancel dictation"></button>
    </main>
    <script type="module" src="./app/pill.ts"></script>
  </body>
</html>
